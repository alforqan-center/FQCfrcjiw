<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">أولى إعدادي - On Fire Academy</title>
    <!-- استيراد خطوط احترافية -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,800;0,900;1,800&family=Cairo:wght@600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #cbd5e1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255, 107, 0, 0.05) 0%, rgba(11, 15, 25, 0.95) 100%);
            z-index: -1;
        }
        header {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #1e293b;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .site-logo {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #ff6b00;
            box-shadow: 0 0 12px rgba(255, 107, 0, 0.3);
            background-color: #000;
            flex-shrink: 0;
        }
        .site-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .logo-area h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #ffffff;
        }
        .logo-area h1 .fire-text {
            background: linear-gradient(135deg, #ff7700 0%, #ff3b00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 85, 0, 0.3);
        }
        .logo-area span.academy-text {
            font-family: 'Cairo', sans-serif;
            font-size: 13px;
            font-weight: 700;
            color: #94a3b8;
            letter-spacing: 2px;
            margin-right: 6px;
        }
        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .lang-btn {
            background-color: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .lang-btn:hover {
            border-color: #ff6b00;
            color: #fff;
        }
        .logout-btn {
            background-color: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .logout-btn:hover {
            background-color: #ef4444;
            color: white;
        }
        .container {
            flex: 1;
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
            width: 90%;
        }
        .section-title {
            margin-bottom: 8px;
            color: #f9fafb;
            font-size: 22px;
            font-weight: 700;
        }
        .section-desc {
            margin-bottom: 25px;
            color: #9ca3af;
            font-size: 14px;
        }
        .teachers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .teacher-card {
            background: #111827;
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid #1f2937;
            text-align: right;
        }
        .teacher-card:hover {
            transform: translateY(-4px);
            border-color: #ff6b00;
            box-shadow: 0 12px 25px rgba(255, 107, 0, 0.1);
        }
        .teacher-avatar {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ff6b00;
            background-color: #030712;
            flex-shrink: 0;
        }
        .teacher-info {
            flex: 1;
        }
        .teacher-info h3 {
            font-size: 16px;
            color: #f9fafb;
            margin-bottom: 4px;
            font-weight: 700;
        }
        .lessons-section {
            background: #111827;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 20px 30px -5px rgba(0, 0, 0, 0.6);
            border: 1px solid #1f2937;
            display: none;
        }
        .lessons-section h2 {
            color: #f9fafb;
            margin-bottom: 20px;
            font-size: 20px;
        }
        .unit-title {
            color: #38bdf8;
            font-size: 17px;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 12px;
            border-bottom: 1px dashed #1e293b;
            padding-bottom: 6px;
        }
        .lesson-item {
            padding: 15px 0;
            border-bottom: 1px solid #1f2937;
            margin-bottom: 15px;
        }
        .lesson-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }
        .lesson-title {
            font-weight: 700;
            font-size: 15px;
            color: #f3f4f6;
            margin-bottom: 10px;
        }
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #374151;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .video-container div,
        .video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .back-to-teachers {
            background-color: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
        }
        .back-to-teachers:hover {
            background-color: #334155;
            color: white;
        }
        footer {
            text-align: center;
            padding: 20px;
            background-color: #0f172a;
            color: #64748b;
            font-size: 12px;
            border-top: 1px solid #1e293b;
        }
    </style>

    <!-- استيراد فايربيس -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <!-- استيراد مشغل يوتيوب الرسمي API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    
    <script>
        const firebaseConfig = {
            databaseURL: "https://alforqan-6e69b-default-rtdb.firebaseio.com/"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const guardDb = firebase.database();

        async function checkStudentSession() {
            const activeCode = localStorage.getItem('activeStudentCode');
            if (!activeCode) {
                window.location.href = "index.html";
                return;
            }

            try {
                const adminSnap = await guardDb.ref('settings/adminCode').once('value');
                if (adminSnap.exists() && activeCode === adminSnap.val()) return;

                const snap = await guardDb.ref('codes/' + activeCode).once('value');
                if (!snap.exists()) {
                    localStorage.removeItem('activeStudentCode');
                    window.location.href = "index.html?expired=true";
                    return;
                }

                const data = snap.val();
                let status = data.status ? data.status.toString().trim().toLowerCase() : 'active';

                if (status === 'inactive' || status === 'stopped' || status === 'false') {
                    localStorage.removeItem('activeStudentCode');
                    window.location.href = "index.html?expired=true";
                    return;
                }
            } catch (e) {
                console.log("فحص الجلسة يعمل في الخلفية...");
            }
        }

        window.addEventListener('DOMContentLoaded', checkStudentSession);
    </script>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="site-logo">
                <img src="https://i.postimg.cc/Fz97Zty5/Whats-App-Image-2026-09-10-at-2-49-35-AM.jpg" alt="On Fire Logo">
            </div>
            <h1><span class="fire-text">On Fire</span> <span class="academy-text">ACADEMY</span></h1>
        </div>
        <div class="header-actions">
            <button class="lang-btn" id="langToggleBtn" onclick="toggleLanguage()">English</button>
            <button class="logout-btn" id="logoutBtnText" onclick="logout()">خروج</button>
        </div>
    </header>

    <div class="container">
        <!-- عرض قائمة المدرسين -->
        <div id="teachersView">
            <h2 class="section-title" id="mainSectionTitle">المرحلة الإعدادية (أولى إعدادي)</h2>
            <p class="section-desc" id="chooseTeacherText">اختر المعلم لعرض الدروس والفيديوهات الخاصة بها:</p>
            <div class="teachers-grid" id="teachersGrid"></div>
        </div>

        <!-- عرض دروس المدرس المحدد -->
        <div id="lessonsView" class="lessons-section">
            <button class="back-to-teachers" id="backBtnText" onclick="showTeachersList()">← العودة لقائمة المدرسين</button>
            <h2 id="selectedTeacherTitle">دروس المعلم</h2>
            <div id="lessonsListContainer"></div>
        </div>
    </div>

    <footer>
        <span id="footerText">جميع الحقوق محفوظة © On Fire Academy 2026</span>
    </footer>

    <script>
        let currentLang = 'ar';
        let ytPlayers = [];
        
        const teachersList = [
            { name: "هيثم ثابت (اللغة العربية)", nameEn: "Haitham Thabet (Arabic)", image: "https://i.postimg.cc/Ghk1RMsg/lqtt-shasht-2026-09-10-040523.png" },
            { name: "محمد فهمي (اللغة العربية)", nameEn: "Mohamed Fahmy (Arabic)", image: "https://i.postimg.cc/yYqzwqkq/lqtt-shasht-2026-09-10-040509.png" },
            { name: "سلمى جمعة (اللغة الإنجليزية)", nameEn: "Salma Gomaa (English)", image: "https://i.postimg.cc/fyPQbFvV/lqtt-shasht-2026-09-10-035030.png" },
            { name: "هاني عبد العاطي (اللغة الإنجليزية)", nameEn: "Hany Abdelaty (English)", image: "https://i.postimg.cc/dt8KFWTS/lqtt-shasht-2026-09-10-040538.png" },
            { name: "بيتر رضا (العلوم)", nameEn: "Peter Reda (Science)", image: "https://i.postimg.cc/GtFgW5SP/lqtt-shasht-2026-09-10-041005.png" },
            { name: "محمود حسان (العلوم)", nameEn: "Mahmoud Hassan (Science)", image: "https://i.postimg.cc/mZzmc1kH/lqtt-shasht-2026-09-09-012312.png" },
            { name: "إبراهيم الدوسري (الدراسات الاجتماعية)", nameEn: "Ibrahim Aldosari (Social Studies)", image: "https://i.postimg.cc/KjzQHWb0/lqtt-shasht-2026-09-09-012550.png" },
            { name: "إسلام سليمان (الرياضيات)", nameEn: "Eslam Soliman (Mathematics)", image: "https://i.postimg.cc/RCpBG6xT/lqtt-shasht-2026-09-10-035113.png" },
            { name: "محمد الشيخ (الرياضيات)", nameEn: "Mohamed Elsheikh (Mathematics)", image: "https://i.postimg.cc/c1zJC5Cm/lqtt-shasht-2026-09-10-042650.png" },
            { name: "محمود بدر (اللغة الألمانية)", nameEn: "Mahmoud Badr (German)", image: "https://i.postimg.cc/BbT7rVw2/lqtt-shasht-2026-09-10-040840.png" },
            { name: "أحمد العجمي (الرياضيات لغات)", nameEn: "Ahmed Elagamy (Math Languages)", image: "https://i.postimg.cc/90dg6nNG/lqtt-shasht-2026-09-10-040937.png" },
            { name: "شدوى شومان (العلوم لغات)", nameEn: "Shadwa Shouman (Science Languages)", image: "https://i.postimg.cc/pVcHkhMk/lqtt-shasht-2026-09-10-035212.png" },
            { name: "عبد الله يوسف (العلوم لغات)", nameEn: "Abdallah Youssef (Science Languages)", image: "https://i.postimg.cc/sxYHkN0Y/lqtt-shasht-2026-09-10-040947.png" },
            { name: "عبد الرحمن عبيد (اللغة الفرنسية)", nameEn: "Abdelrahman Obeid (French)", image: "https://i.postimg.cc/66bXz2xc/lqtt-shasht-2026-09-10-035144.png" },
            { name: "شيماء شومان (التربية الإسلامية)", nameEn: "Shaimaa Shouman (Islamic Ed)", image: "https://i.postimg.cc/G3gCz8nq/lqtt-shasht-2026-09-10-035235.png" }
        ];

        let firebaseLessonsData = {};
        let pendingPlayers = [];

        window.onload = function() {
            const activeCode = localStorage.getItem('activeStudentCode');
            if (!activeCode) {
                window.location.href = 'index.html';
                return;
            }

            guardDb.ref('lessons/أولى_إعدادي').once('value')
                .then(snapshot => {
                    if (snapshot.exists()) {
                        firebaseLessonsData = snapshot.val();
                    }
                    renderTeachers();
                })
                .catch(err => {
                    console.log("خطأ في جلب الدروس:", err);
                    renderTeachers();
                });
        };

        function logout() {
            localStorage.removeItem('activeStudentCode');
            window.location.href = 'index.html';
        }

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            const htmlRoot = document.getElementById('htmlRoot');
            
            if (currentLang === 'en') {
                htmlRoot.setAttribute('lang', 'en');
                htmlRoot.setAttribute('dir', 'ltr');
                document.getElementById('pageTitle').innerText = "First Prep - On Fire Academy";
                document.getElementById('langToggleBtn').innerText = "العربية";
                document.getElementById('logoutBtnText').innerText = "Logout";
                document.getElementById('mainSectionTitle').innerText = "Preparatory Stage (First Prep)";
                document.getElementById('chooseTeacherText').innerText = "Select a teacher to view their lessons and videos:";
                document.getElementById('backBtnText').innerText = "← Back to Teachers List";
                document.getElementById('footerText').innerText = "All Rights Reserved © On Fire Academy 2026";
            } else {
                htmlRoot.setAttribute('lang', 'ar');
                htmlRoot.setAttribute('dir', 'rtl');
                document.getElementById('pageTitle').innerText = "أولى إعدادي - On Fire Academy";
                document.getElementById('langToggleBtn').innerText = "English";
                document.getElementById('logoutBtnText').innerText = "خروج";
                document.getElementById('mainSectionTitle').innerText = "المرحلة الإعدادية (أولى إعدادي)";
                document.getElementById('chooseTeacherText').innerText = "اختر المعلم لعرض الدروس والفيديوهات الخاصة بها:";
                document.getElementById('backBtnText').innerText = "← العودة لقائمة المدرسين";
                document.getElementById('footerText').innerText = "جميع الحقوق محفوظة © On Fire Academy 2026";
            }
            renderTeachers();
            
            const lessonsView = document.getElementById('lessonsView');
            if (lessonsView.style.display === 'block' && window.selectedTeacherName !== undefined) {
                selectTeacher(window.selectedTeacherName);
            }
        }

        function renderTeachers() {
            const grid = document.getElementById('teachersGrid');
            grid.innerHTML = "";

            teachersList.forEach((teacher) => {
                const card = document.createElement('div');
                card.className = 'teacher-card';
                card.onclick = () => selectTeacher(teacher.name);

                const tName = currentLang === 'ar' ? teacher.name : teacher.nameEn;

                card.innerHTML = `
                    <img src="${teacher.image}" alt="${tName}" class="teacher-avatar">
                    <div class="teacher-info">
                        <h3>${tName}</h3>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // دالة إنشاء المشغل عبر YouTube IFrame Player API بكامل المزايا ومنع الخروج للرابط
        function generateVideoPlayer(rawUrl, uniqueId) {
            if (!rawUrl) return "<p style='color:#ef4444;'>رابط الفيديو غير متوفر</p>";
            let url = rawUrl.trim();

            const ytRegExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const ytMatch = url.match(ytRegExp);
            if (ytMatch && ytMatch[2].length === 11) {
                let yId = ytMatch[2];
                pendingPlayers.push({ divId: uniqueId, videoId: yId });
                return `
                    <div class="video-container">
                        <div id="${uniqueId}"></div>
                    </div>`;
            }

            // للفيديوهات المباشرة الأخرى
            return `
                <div class="video-container">
                    <video controls controlsList="nodownload" playsinline style="width:100%; height:100%; background:#000;">
                        <source src="${url}" type="video/mp4">
                        <source src="${url}" type="video/webm">
                        متصفحك لا يدعم مشغل الفيديو المباشر.
                    </video>
                </div>`;
        }

        // تهيئة المشغلات بعد بناء الـ DOM عبر مكتبة يوتيوب الرسمية
        function initializePendingPlayers() {
            if (typeof YT === 'undefined' || typeof YT.Player === 'undefined') {
                setTimeout(initializePendingPlayers, 100);
                return;
            }
            ytPlayers = [];
            pendingPlayers.forEach(item => {
                try {
                    let player = new YT.Player(item.divId, {
                        videoId: item.videoId,
                        playerVars: {
                            'playsinline': 1,
                            // Hides all YouTube player controls, including its share controls; this does not prevent URL extraction.
                            'controls': 0,
                            'rel': 0,
                            'iv_load_policy': 3
                        },
                        events: {
                            'onReady': (event) => {
                                // إخفاء أي محاولة لفتح الروابط عبر طبقة الحماية فوق المشغل
                            }
                        }
                    });
                    ytPlayers.push(player);
                } catch(e) {}
            });
            pendingPlayers = [];
        }

        function selectTeacher(teacherName) {
            window.selectedTeacherName = teacherName;
            document.getElementById('teachersView').style.display = 'none';
            document.getElementById('lessonsView').style.display = 'block';

            document.getElementById('selectedTeacherTitle').innerText = `دروس الأستاذ: ${teacherName}`;

            const container = document.getElementById('lessonsListContainer');
            container.innerHTML = "";
            pendingPlayers = [];

            let teacherData = firebaseLessonsData[teacherName] || firebaseLessonsData[teacherName.replace(/\s+/g, '_')] || {};
            let hasLessons = false;
            let counter = 0;

            for (let unitKey in teacherData) {
                let unitName = unitKey.replace(/_/g, ' ');
                let unitsLessons = teacherData[unitKey];

                if (typeof unitsLessons === 'object' && unitsLessons !== null) {
                    let unitDiv = document.createElement('div');
                    unitDiv.className = 'unit-title';
                    unitDiv.innerText = `📂 ${unitName}`;
                    container.appendChild(unitDiv);

                    for (let lessonId in unitsLessons) {
                        let lesson = unitsLessons[lessonId];
                        if (lesson && lesson.lessonName) {
                            hasLessons = true;
                            counter++;
                            let uniqueDivId = `yt_player_${counter}_${Math.random().toString(36.substring(2, 7))}`;
                            let playerHtml = generateVideoPlayer(lesson.youtubeUrl, uniqueDivId);

                            let lessonDiv = document.createElement('div');
                            lessonDiv.className = 'lesson-item';
                            
                            lessonDiv.innerHTML = `
                                <div class="lesson-title">📖 ${lesson.lessonName}</div>
                                ${playerHtml}
                            `;
                            container.appendChild(lessonDiv);
                        }
                    }
                }
            }

            if (!hasLessons) {
                container.innerHTML = currentLang === 'ar' ? 
                    "<p style='color: #9ca3af; text-align: center; padding: 20px;'>لا توجد دروس مضافة لهذا المعلم حتى الآن.</p>" : 
                    "<p style='color: #9ca3af; text-align: center; padding: 20px;'>No lessons added for this teacher yet.</p>";
            } else {
                setTimeout(initializePendingPlayers, 200);
            }
        }

        function showTeachersList() {
            document.getElementById('lessonsListContainer').innerHTML = "";
            document.getElementById('lessonsView').style.display = 'none';
            document.getElementById('teachersView').style.display = 'block';

            if (screen.orientation && screen.orientation.unlock) {
                try {
                    screen.orientation.unlock();
                } catch (e) {}
            }

            window.dispatchEvent(new Event('resize'));
        }
    </script>
</body>
</html>
