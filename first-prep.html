<!DOCTYPE html>

<html lang="ar" dir="rtl" id="htmlRoot">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title id="pageTitle">أولى إعدادي - المنصة التعليمية</title>

    <!-- استيراد خطوط احترافية -->

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,800;0,900;1,800&family=Cairo:wght@600;700;900&display=swap" rel="stylesheet">

    <style>

        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

            font-family: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

        }

        body {

            background-color: #0b0f19;

            color: #cbd5e1;

            display: flex;

            flex-direction: column;

            min-height: 100vh;

            position: relative;

        }

        body::before {

            content: '';

            position: absolute;

            top: 0;

            left: 0;

            width: 100%;

            height: 100%;

            background: linear-gradient(135deg, rgba(255, 107, 0, 0.05) 0%, rgba(11, 15, 25, 0.95) 100%);

            z-index: -1;

        }

        header {

            background-color: #0f172a;

            color: #f8fafc;

            padding: 18px 40px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            border-bottom: 2px solid #1e293b;

        }

        .logo-area {

            display: flex;

            align-items: center;

            gap: 14px;

        }

        .site-logo {

            width: 44px;

            height: 44px;

            border-radius: 50%;

            overflow: hidden;

            border: 2px solid #ff6b00;

            box-shadow: 0 0 12px rgba(255, 107, 0, 0.3);

            background-color: #000;

            flex-shrink: 0;

        }

        .site-logo img {

            width: 100%;

            height: 100%;

            object-fit: cover;

        }

        .logo-area h1 {

            font-family: 'Montserrat', sans-serif;

            font-size: 22px;

            font-weight: 900;

            letter-spacing: 1px;

            text-transform: uppercase;

            color: #ffffff;

        }

        .logo-area h1 .fire-text {

            background: linear-gradient(135deg, #ff7700 0%, #ff3b00 100%);

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

            text-shadow: 0 0 20px rgba(255, 85, 0, 0.3);

        }

        .logo-area span.academy-text {

            font-family: 'Cairo', sans-serif;

            font-size: 13px;

            font-weight: 700;

            color: #94a3b8;

            letter-spacing: 2px;

            margin-right: 6px;

        }

        .header-actions {

            display: flex;

            gap: 12px;

            align-items: center;

        }

        .lang-btn {

            background-color: #1e293b;

            color: #cbd5e1;

            border: 1px solid #334155;

            padding: 6px 16px;

            border-radius: 20px;

            cursor: pointer;

            font-size: 13px;

            font-weight: 600;

            transition: all 0.2s;

        }

        .lang-btn:hover {

            border-color: #ff6b00;

            color: #fff;

        }

        .logout-btn {

            background-color: rgba(239, 68, 68, 0.1);

            color: #f87171;

            border: 1px solid rgba(239, 68, 68, 0.2);

            padding: 6px 16px;

            border-radius: 20px;

            cursor: pointer;

            font-size: 13px;

            font-weight: 600;

            transition: all 0.2s;

        }

        .logout-btn:hover {

            background-color: #ef4444;

            color: white;

        }

        .container {

            flex: 1;

            max-width: 1000px;

            margin: 30px auto;

            padding: 20px;

            width: 90%;

        }

        .section-title {

            margin-bottom: 8px;

            color: #f9fafb;

            font-size: 22px;

            font-weight: 700;

        }

        .section-desc {

            margin-bottom: 25px;

            color: #9ca3af;

            font-size: 14px;

        }

        .teachers-grid {

            display: grid;

            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));

            gap: 20px;

            margin-bottom: 40px;

        }

        .teacher-card {

            background: #111827;

            padding: 18px;

            border-radius: 12px;

            box-shadow: 0 10px 20px rgba(0,0,0,0.3);

            display: flex;

            align-items: center;

            gap: 16px;

            cursor: pointer;

            transition: all 0.2s ease;

            border: 1px solid #1f2937;

            text-align: right;

        }

        .teacher-card:hover {

            transform: translateY(-4px);

            border-color: #ff6b00;

            box-shadow: 0 12px 25px rgba(255, 107, 0, 0.1);

        }

        .teacher-avatar {

            width: 65px;

            height: 65px;

            border-radius: 50%;

            object-fit: cover;

            border: 2px solid #ff6b00;

            background-color: #030712;

            flex-shrink: 0;

        }

        .teacher-info {

            flex: 1;

        }

        .teacher-info h3 {

            font-size: 16px;

            color: #f9fafb;

            margin-bottom: 4px;

            font-weight: 700;

        }

        .teacher-info p {

            font-size: 13px;

            color: #9ca3af;

        }

        .lessons-section {

            background: #111827;

            padding: 30px;

            border-radius: 14px;

            box-shadow: 0 20px 30px -5px rgba(0, 0, 0, 0.6);

            border: 1px solid #1f2937;

            display: none;

        }

        .lessons-section h2 {

            color: #f9fafb;

            margin-bottom: 20px;

            font-size: 20px;

        }

        .lesson-item {

            padding: 20px 0;

            border-bottom: 1px solid #1f2937;

            margin-bottom: 15px;

        }

        .lesson-item:last-child {

            border-bottom: none;

            margin-bottom: 0;

        }

        .lesson-title {

            font-weight: 700;

            font-size: 16px;

            color: #f3f4f6;

            margin-bottom: 12px;

        }

        .video-container {

            position: relative;

            width: 100%;

            padding-bottom: 56.25%;

            height: 0;

            background: #000;

            border-radius: 10px;

            overflow: hidden;

            border: 1px solid #374151;

            box-shadow: 0 4px 15px rgba(0,0,0,0.5);

        }

        .video-container iframe {

            position: absolute;

            top: 0;

            left: 0;

            width: 100%;

            height: 100%;

            border: none;

        }

        .back-to-teachers {

            background-color: #1e293b;

            color: #cbd5e1;

            border: 1px solid #334155;

            padding: 8px 16px;

            border-radius: 8px;

            cursor: pointer;

            margin-bottom: 20px;

            font-weight: 600;

            font-size: 13px;

            transition: all 0.2s;

        }

        .back-to-teachers:hover {

            background-color: #334155;

            color: white;

        }

        footer {

            text-align: center;

            padding: 20px;

            background-color: #0f172a;

            color: #64748b;

            font-size: 12px;

            border-top: 1px solid #1e293b;

        }

    </style>

</head>

<body>



    <header>

        <div class="logo-area">

            <div class="site-logo">

                <img src="https://i.postimg.cc/Fz97Zty5/Whats-App-Image-2026-09-10-at-2-49-35-AM.jpg" alt="On Fire Logo">

            </div>

            <h1><span class="fire-text">On Fire</span> <span class="academy-text">ACADEMY</span></h1>

        </div>

        <div class="header-actions">

            <button class="lang-btn" id="langToggleBtn" onclick="toggleLanguage()">English</button>

            <button class="logout-btn" id="logoutBtnText" onclick="logout()">خروج</button>

        </div>

    </header>



    <div class="container">

        <!-- عرض قائمة المدرسين -->

        <div id="teachersView">

            <h2 class="section-title" id="mainSectionTitle">المرحلة الإعدادية (أولى إعدادي)</h2>

            <p class="section-desc" id="chooseTeacherText">اختر المعلم لعرض الدروس والفيديوهات الخاصة بها:</p>

            <div class="teachers-grid" id="teachersGrid"></div>

        </div>



        <!-- عرض دروس المدرس المحدد -->

        <div id="lessonsView" class="lessons-section">

            <button class="back-to-teachers" id="backBtnText" onclick="showTeachersList()">← العودة لقائمة المدرسين</button>

            <h2 id="selectedTeacherTitle">دروس المعلم</h2>

            <div id="lessonsListContainer"></div>

        </div>

    </div>



    <footer>

        <span id="footerText">جميع الحقوق محفوظة © On Fire Academy 2026</span>

    </footer>



    <script>

                lessons: [

                ]

                ]

                image: "https://i.postimg.cc/RCpBG6xT/lqtt-shasht-2026-09-10-035113.png",

                lessons: [

                image: "https://i.postimg.cc/c1zJC5Cm/lqtt-shasht-2026-09-10-042650.png",

                lessons: [

            },

            },

                image: "https://i.postimg.cc/90dg6nNG/lqtt-shasht-2026-09-10-040937.png",

                ]

            },

            {

                image: "https://i.postimg.cc/pVcHkhMk/lqtt-shasht-2026-09-10-035212.png",

            {

                lessons: [

                    { titleAr: "Lesson 1: Plant Reproduction", titleEn: "Lesson 1: Plant Reproduction", youtube: "dQw4w9WgXcQ" }

                ]

            },

            {

                nameAr: "عبد الرحمن عبيد", nameEn: "Abdelrahman Obeid",

                subjectAr: "اللغة الفرنسية", subjectEn: "French",

                image: "https://i.postimg.cc/66bXz2xc/lqtt-shasht-2026-09-10-035144.png",

                lessons: [

                    { titleAr: "Leçon 1: Les Salutations", titleEn: "Leçon 1: Les Salutations", youtube: "dQw4w9WgXcQ" }

                ]

            },

            {

                nameAr: "شيماء شومان", nameEn: "Shaimaa Shouman",

                subjectAr: "التربية الإسلامية", subjectEn: "Islamic Education",

                image: "https://i.postimg.cc/G3gCz8nq/lqtt-shasht-2026-09-10-035235.png",

                lessons: [

                    { titleAr: "الدرس الأول: عظمة الله في الكون", titleEn: "Lesson 1: Greatness of Allah in the Universe", youtube: "dQw4w9WgXcQ" }

                ]

            }

        ];



        window.onload = function() {

            const activeCode = localStorage.getItem('activeStudentCode');

            if (!activeCode) {

                window.location.href = 'index.html';

            }

            renderTeachers();

        };



        function logout() {

            localStorage.removeItem('activeStudentCode');

            window.location.href = 'index.html';

        }



        function toggleLanguage() {

            currentLang = currentLang === 'ar' ? 'en' : 'ar';

            const htmlRoot = document.getElementById('htmlRoot');

            

            if (currentLang === 'en') {

                htmlRoot.setAttribute('lang', 'en');

                htmlRoot.setAttribute('dir', 'ltr');

                document.getElementById('pageTitle').innerText = "First Prep - Educational Platform";

                document.getElementById('langToggleBtn').innerText = "العربية";

                document.getElementById('logoutBtnText').innerText = "Logout";

                document.getElementById('mainSectionTitle').innerText = "Preparatory Stage Teachers (First Prep)";

                document.getElementById('chooseTeacherText').innerText = "Select a teacher to view their lessons and videos:";

                document.getElementById('backBtnText').innerText = "← Back to Teachers List";

                document.getElementById('footerText').innerText = "All Rights Reserved © On Fire Academy 2026";

            } else {

                htmlRoot.setAttribute('lang', 'ar');

                htmlRoot.setAttribute('dir', 'rtl');

                document.getElementById('pageTitle').innerText = "أولى إعدادي - المنصة التعليمية";

                document.getElementById('langToggleBtn').innerText = "English";

                document.getElementById('logoutBtnText').innerText = "خروج";

                document.getElementById('mainSectionTitle').innerText = "المرحلة الإعدادية (أولى إعدادي)";

                document.getElementById('chooseTeacherText').innerText = "اختر المعلم لعرض الدروس والفيديوهات الخاصة بها:";

                document.getElementById('backBtnText').innerText = "← العودة لقائمة المدرسين";

                document.getElementById('footerText').innerText = "جميع الحقوق محفوظة © On Fire Academy 2026";

            }

            renderTeachers();

            

            const lessonsView = document.getElementById('lessonsView');

            if (lessonsView.style.display === 'block' && window.selectedTeacherIndex !== undefined) {

                selectTeacher(window.selectedTeacherIndex);

            }

        }



        function renderTeachers() {

            const grid = document.getElementById('teachersGrid');

            grid.innerHTML = "";



            teachersData.forEach((teacher, index) => {

                const card = document.createElement('div');

                card.className = 'teacher-card';

                card.onclick = () => selectTeacher(index);



                const tName = currentLang === 'ar' ? teacher.nameAr : teacher.nameEn;

                const tSubject = currentLang === 'ar' ? teacher.subjectAr : teacher.subjectEn;



                card.innerHTML = `

                    <img src="${teacher.image}" alt="${tName}" class="teacher-avatar">

                    <div class="teacher-info">

                        <h3>${tName}</h3>

                        <p>${tSubject}</p>

                    </div>

                `;

                grid.appendChild(card);

            });

        }



        function selectTeacher(index) {

            window.selectedTeacherIndex = index;

            const teacher = teachersData[index];

            document.getElementById('teachersView').style.display = 'none';

            document.getElementById('lessonsView').style.display = 'block';



            const tName = currentLang === 'ar' ? teacher.nameAr : teacher.nameEn;

            const tSubject = currentLang === 'ar' ? teacher.subjectAr : teacher.subjectEn;



            if (currentLang === 'ar') {

                document.getElementById('selectedTeacherTitle').innerText = `دروس الأستاذ: ${tName} (${tSubject})`;

            } else {

                document.getElementById('selectedTeacherTitle').innerText = `Teacher Lessons: ${tName} (${tSubject})`;

            }



            const container = document.getElementById('lessonsListContainer');

            container.innerHTML = "";



            if (teacher.lessons.length === 0) {

                container.innerHTML = currentLang === 'ar' ? "<p style='color: #9ca3af;'>لا توجد دروس مضافة لهذا المعلم حالياً.</p>" : "<p style='color: #9ca3af;'>No lessons added for this teacher currently.</p>";

                return;

            }



            teacher.lessons.forEach(lesson => {

                const lTitle = currentLang === 'ar' ? lesson.titleAr : lesson.titleEn;

                const lessonDiv = document.createElement('div');

                lessonDiv.className = 'lesson-item';

                

                lessonDiv.innerHTML = `

                    <div class="lesson-title">${lTitle}</div>

                    <div class="video-container">

                        <iframe src="https://www.youtube-nocookie.com/embed/${lesson.youtube}?enablejsapi=1&playsinline=1&modestbranding=1" 

                                title="YouTube video player" 

                                frameborder="0" 

                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 

                                allowfullscreen>

                        </iframe>

                    </div>

                `;

                container.appendChild(lessonDiv);

            });

        }



        function showTeachersList() {

            document.getElementById('lessonsListContainer').innerHTML = "";

            document.getElementById('lessonsView').style.display = 'none';

            document.getElementById('teachersView').style.display = 'block';



            if (screen.orientation && screen.orientation.unlock) {

                try {

                    screen.orientation.unlock();

                } catch (e) {}

            }



            window.dispatchEvent(new Event('resize'));

        }

    </script>



</body>

</html>
