<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>On Fire Academy - لوحة التحكم والسيطرة</title>
    <!-- استيراد مكتبات Firebase عبر CDN -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Cairo", Arial, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #cbd5e1;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .container {
            max-width: 750px;
            margin: auto;
            background: #111827;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 20px 30px -5px rgba(0, 0, 0, 0.6);
            border: 1px solid #1f2937;
            width: 100%;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        h2 { 
            color: #ffffff; 
            font-size: 24px; 
            font-weight: 900;
            margin: 0;
        }
        .logout-btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            width: auto;
            padding: 8px 16px;
            font-size: 13px;
            margin: 0;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }
        .form-section, .search-section, .settings-section, .stats-section {
            background: #1f2937;
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #374151;
        }
        .search-section { background: #0f172a; border-color: #1e293b; }
        .settings-section { background: #182235; border-color: #ff6b00; border-width: 1.5px; }
        .stats-section { display: flex; justify-content: space-between; align-items: center; background: #0f172a; border-color: #1e293b; font-size: 14px; font-weight: bold; color: #38bdf8; }
        
        .form-group { margin-bottom: 15px; }
        label { 
            display: block; 
            margin-bottom: 6px; 
            font-weight: 700; 
            font-size: 13px; 
            color: #d1d5db;
        }
        input, select, button {
            width: 100%;
            padding: 12px;
            border: 1px solid #374151;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            background-color: #030712;
            color: #fff;
            outline: none;
            font-weight: 600;
        }
        input:focus, select:focus {
            border-color: #ff6b00;
            box-shadow: 0 0 0 3px rgba(255, 107, 0, 0.15);
        }
        button {
            background: linear-gradient(135deg, #ff6b00, #e65c00);
            color: white;
            border: none;
            font-weight: 700;
            cursor: pointer;
            margin-top: 5px;
            transition: all 0.2s ease;
            font-size: 16px;
            box-shadow: 0 4px 12px rgba(255, 107, 0, 0.3);
        }
        button:hover { 
            background: linear-gradient(135deg, #e65c00, #cc5200); 
        }
        .name-list {
            background: #030712;
            border: 1px solid #1f2937;
            border-radius: 8px;
            margin-top: 6px;
            max-height: 180px;
            overflow-y: auto;
        }
        .name-item {
            padding: 10px 14px;
            border-bottom: 1px solid #1f2937;
            cursor: pointer;
            font-size: 14px;
            color: #cbd5e1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .name-item:hover { background-color: #1e293b; color: #ff6b00; font-weight: bold; }
        .action-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }
        .edit-mode-btn { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; }
        .delete-mode-btn { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .new-mode-btn { background: linear-gradient(135deg, #10b981, #059669); }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <h2>On Fire Academy - لوحة التحكم</h2>
        <button id="logoutBtn" class="logout-btn">🚪 تسجیل خروج</button>
    </div>

    <!-- الإحصائيات -->
    <div class="stats-section">
        <span id="totalStudentsCount">📊 إجمالي الطلاب: جاري التحميل...</span>
        <button id="refreshBtn" style="width: auto; padding: 6px 14px; font-size: 13px; margin:0;">🔄 تحديث</button>
    </div>

    <!-- كود الكنترول -->
    <div class="settings-section">
        <label style="color: #ff6b00;">⚙️ إعدادات الكنترول السري:</label>
        <div style="display: flex; gap: 10px; margin-top: 8px;">
            <input type="text" id="adminCodeInput" placeholder="كود الكنترول الجديد" maxlength="6">
            <button id="updateAdminBtn" style="width: 140px; margin-top:0;">تحديث الكود</button>
        </div>
    </div>

    <!-- البحث الفوري -->
    <div class="search-section">
        <label>🔍 بحث سريع (بالاسم أو الكود):</label>
        <input type="text" id="searchInput" placeholder="اكتب للبحث..." autocomplete="off">
        <div id="nameListContainer" class="name-list" style="display: none;"></div>
    </div>

    <!-- نموذج بيانات الطالب -->
    <div class="form-section">
        <input type="hidden" id="originalCode" value="">
        <div class="form-group">
            <label>اسم الطالب:</label>
            <input type="text" id="studentNameInput" placeholder="أدخل اسم الطالب..." autocomplete="off">
        </div>
        <div class="form-group">
            <label>كود التفعيل (4 أرقام):</label>
            <input type="text" id="codeInput" placeholder="أدخل كود الطالب..." autocomplete="off" maxlength="4">
        </div>
        <div class="form-group">
            <label>المرحلة الدراسية:</label>
            <select id="gradeSelect">
                <option value="أولى إعدادي">أولى إعدادي</option>
                <option value="ثانية إعدادي">ثانية إعدادي</option>
                <option value="ثالثة إعدادي">ثالثة إعدادي</option>
                <option value="أولى ثانوي">أولى ثانوي</option>
                <option value="ثانية ثانوي">ثانية ثانوي</option>
                <option value="ثالثة ثانوي">ثالثة ثانوي</option>
            </select>
        </div>
        <div class="form-group">
            <label>حالة الاشتراك / الكود:</label>
            <select id="statusSelect">
                <option value="active">🟢 يعمل (تم الدفع)</option>
                <option value="inactive">🔴 متوقف (لم يدفع الاشتراك)</option>
            </select>
        </div>

        <!-- أزرار التحكم -->
        <div id="defaultAddBtnContainer">
            <button id="addStudentBtn">إضافة طالب جديد</button>
        </div>

        <div id="selectedStudentActions" class="action-buttons" style="display: none;">
            <button id="editBtn" class="edit-mode-btn">تعديل</button>
            <button id="deleteBtn" class="delete-mode-btn">حذف</button>
            <button id="resetBtn" class="new-mode-btn">إضافة جديد</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        databaseURL: "https://alforqan-6e69b-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let allStudentsCache = [];

    // تحميل البيانات وإحصائيات الطلاب
    async function loadData() {
        try {
            const adminSnapshot = await db.ref('settings/adminCode').once('value');
            if (adminSnapshot.exists()) {
                document.getElementById("adminCodeInput").value = adminSnapshot.val();
            } else {
                document.getElementById("adminCodeInput").value = "0000";
            }

            const snapshot = await db.ref('codes').once('value');
            allStudentsCache = [];
            if (snapshot.exists()) {
                const data = snapshot.val();
                for (let codeKey in data) {
                    let info = data[codeKey];
                    allStudentsCache.push({
                        codeKey: codeKey,
                        studentName: info.studentName || info.name || "بدون اسم",
                        grade: info.grade || "أولى إعدادي",
                        status: info.status || "active",
                        deviceId: info.deviceId || null
                    });
                }
            }
            document.getElementById("totalStudentsCount").innerText = `📊 إجمالي الطلاب المسجلين: ${allStudentsCache.length}`;
        } catch (error) {
            console.error("خطأ في جلب البيانات:", error);
            document.getElementById("totalStudentsCount").innerText = "📊 خطأ في الاتصال بقاعدة البيانات";
        }
    }

    // زر الخروج الآمن
    function logoutAdmin() {
        localStorage.removeItem('activeStudentCode');
        window.location.href = "index.html";
    }

    // تحديث كود الكنترول
    async function updateAdminCode() {
        const newAdminCode = document.getElementById("adminCodeInput").value.trim();
        if (!newAdminCode) {
            alert("يرجى إدخال كود صحيح للكنترول!");
            return;
        }
        try {
            await db.ref('settings/adminCode').set(newAdminCode);
            alert("تم تحديث كود الكنترول السري بنجاح!");
        } catch (e) {
            alert("حدث خطأ أثناء تحديث كود الكنترول.");
        }
    }

    // البحث الفوري
    function filterData() {
        let query = document.getElementById("searchInput").value.toLowerCase().trim();
        let listContainer = document.getElementById("nameListContainer");

        if (!query) {
            listContainer.style.display = "none";
            listContainer.innerHTML = "";
            return;
        }

        let matched = allStudentsCache.filter(item => 
            item.studentName.toLowerCase().includes(query) || item.codeKey.toLowerCase().includes(query)
        );

        if (matched.length === 0) {
            listContainer.style.display = "block";
            listContainer.innerHTML = '<div style="padding: 10px 14px; color: #ef4444; font-size: 14px;">لا توجد نتائج مطابقة</div>';
            return;
        }

        listContainer.style.display = "block";
        listContainer.innerHTML = "";
        
        matched.forEach(item => {
            let div = document.createElement("div");
            div.className = "name-item";
            let statusText = item.status === 'inactive' ? '🔴 متوقف' : '🟢 يعمل';
            div.innerHTML = `<span>👤 ${item.studentName} <span style="color:#94a3b8; font-size:12px;">(${item.codeKey})</span></span> <span style="color:#38bdf8; font-size:12px;">${item.grade} | ${statusText}</span>`;
            div.onclick = function() {
                selectStudent(item);
            };
            listContainer.appendChild(div);
        });
    }

    // اختيار طالب من القائمة لتعديله أو حذفه
    function selectStudent(item) {
        document.getElementById("studentNameInput").value = item.studentName;
        document.getElementById("codeInput").value = item.codeKey;
        document.getElementById("gradeSelect").value = item.grade;
        document.getElementById("statusSelect").value = item.status || "active";
        document.getElementById("originalCode").value = item.codeKey;

        // قفل حقول المدخلات مؤقتاً لحين الضغط على تعديل
        document.getElementById("studentNameInput").disabled = true;
        document.getElementById("codeInput").disabled = true;
        document.getElementById("gradeSelect").disabled = true;
        document.getElementById("statusSelect").disabled = true;

        document.getElementById("defaultAddBtnContainer").style.display = "none";
        document.getElementById("selectedStudentActions").style.display = "grid";
        document.getElementById("nameListContainer").style.display = "none";
        document.getElementById("searchInput").value = "";
    }

    // تفعيل وضع التعديل
    function enableEditing() {
        document.getElementById("studentNameInput").disabled = false;
        document.getElementById("codeInput").disabled = false;
        document.getElementById("gradeSelect").disabled = false;
        document.getElementById("statusSelect").disabled = false;

        let actionsDiv = document.getElementById("selectedStudentActions");
        actionsDiv.style.display = "grid";
        actionsDiv.innerHTML = `
            <button id="saveEditBtn" class="new-mode-btn" style="grid-column: span 2;">حفظ التعديلات</button>
            <button id="cancelEditBtn" class="delete-mode-btn">إلغاء</button>
        `;

        document.getElementById("saveEditBtn").addEventListener("click", saveEditedStudent);
        document.getElementById("cancelEditBtn").addEventListener("click", resetToAddNew);
    }

    // إعادة النماذج لوضع الإضافة الجديدة
    function resetToAddNew() {
        document.getElementById("studentNameInput").value = "";
        document.getElementById("codeInput").value = "";
        document.getElementById("originalCode").value = "";
        document.getElementById("gradeSelect").value = "أولى إعدادي";
        document.getElementById("statusSelect").value = "active";

        document.getElementById("studentNameInput").disabled = false;
        document.getElementById("codeInput").disabled = false;
        document.getElementById("gradeSelect").disabled = false;
        document.getElementById("statusSelect").disabled = false;

        document.getElementById("defaultAddBtnContainer").style.display = "block";
        document.getElementById("selectedStudentActions").style.display = "none";
        
        // إعادة الأزرار الأصلية
        document.getElementById("selectedStudentActions").innerHTML = `
            <button id="editBtn" class="edit-mode-btn">تعديل</button>
            <button id="deleteBtn" class="delete-mode-btn">حذف</button>
            <button id="resetBtn" class="new-mode-btn">إضافة جديد</button>
        `;
        bindActionButtons();
    }

    // إضافة طالب جديد
    async function saveNewStudent() {
        const name = document.getElementById("studentNameInput").value.trim();
        const code = document.getElementById("codeInput").value.trim();
        const grade = document.getElementById("gradeSelect").value;
        const status = document.getElementById("statusSelect").value;

        if (!name || !code) {
            alert("الرجاء إدخال اسم الطالب وكود التفعيل!");
            return;
        }

        try {
            await db.ref(`codes/${code}`).set({
                studentName: name,
                grade: grade,
                status: status
            });
            alert("تم إضافة الطالب وتفعيل الكود بنجاح!");
            resetToAddNew();
            loadData();
        } catch (e) {
            alert("حدث خطأ أثناء الحفظ في قاعدة البيانات.");
        }
    }

    // حفظ التعديلات
    async function saveEditedStudent() {
        const oldCode = document.getElementById("originalCode").value;
        const name = document.getElementById("studentNameInput").value.trim();
        const newCode = document.getElementById("codeInput").value.trim();
        const grade = document.getElementById("gradeSelect").value;
        const status = document.getElementById("statusSelect").value;

        if (!name || !newCode) {
            alert("الرجاء ملء البيانات المطلوبة!");
            return;
        }

        try {
            if (oldCode !== newCode) {
                await db.ref(`codes/${oldCode}`).remove();
            }

            const oldSnap = await db.ref(`codes/${oldCode}`).once('value');
            let existingDeviceId = null;
            if (oldSnap.exists() && oldSnap.val().deviceId) {
                existingDeviceId = oldSnap.val().deviceId;
            }

            let updateData = {
                studentName: name,
                grade: grade,
                status: status
            };
            if (existingDeviceId) updateData.deviceId = existingDeviceId;

            await db.ref(`codes/${newCode}`).set(updateData);

            alert("تم تعديل بيانات الطالب بنجاح!");
            resetToAddNew();
            loadData();
        } catch (e) {
            alert("حدث خطأ أثناء التعديل.");
        }
    }

    // حذف الطالب
    async function deleteSelectedStudent() {
        const code = document.getElementById("codeInput").value.trim();
        if (confirm("هل أنت متأكد من حذف هذا الطالب وكود التفعيل نهائياً؟")) {
            try {
                await db.ref(`codes/${code}`).remove();
                alert("تم حذف الطالب بنجاح.");
                resetToAddNew();
                loadData();
            } catch (e) {
                alert("حدث خطأ أثناء الحذف.");
            }
        }
    }

    // ربط الأحداث بالأزرار بصورة آمنة
    function bindActionButtons() {
        const addBtn = document.getElementById("addStudentBtn");
        if (addBtn) addBtn.onclick = saveNewStudent;

        const editBtn = document.getElementById("editBtn");
        if (editBtn) editBtn.onclick = enableEditing;

        const deleteBtn = document.getElementById("deleteBtn");
        if (deleteBtn) deleteBtn.onclick = deleteSelectedStudent;

        const resetBtn = document.getElementById("resetBtn");
        if (resetBtn) resetBtn.onclick = resetToAddNew;

        const updateAdminBtn = document.getElementById("updateAdminBtn");
        if (updateAdminBtn) updateAdminBtn.onclick = updateAdminCode;

        const refreshBtn = document.getElementById("refreshBtn");
        if (refreshBtn) refreshBtn.onclick = loadData;

        const logoutBtn = document.getElementById("logoutBtn");
        if (logoutBtn) logoutBtn.onclick = logoutAdmin;

        const searchInput = document.getElementById("searchInput");
        if (searchInput) searchInput.oninput = filterData;
    }

    window.onload = function() {
        loadData();
        bindActionButtons();
    };
</script>

</body>
</html>
