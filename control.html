<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>On Fire Academy - لوحة التحكم والإدارة</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Cairo", "Traditional Arabic", "Simplified Arabic", Arial, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #cbd5e1;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: 'f(x) = ∫ e^x dx   ∑ (n=1 to ∞)   π ≈ 3.14159   Δ = b² - 4ac   sin²θ + cos²θ = 1   √x   dy/dx';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            font-size: 15px;
            color: rgba(255, 107, 0, 0.02);
            word-spacing: 30px;
            line-height: 60px;
            z-index: -2;
            user-select: none;
            overflow: hidden;
            padding: 15px;
        }
        body::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(11, 15, 25, 0.97) 0%, rgba(3, 7, 18, 0.99) 100%);
            z-index: -1;
        }
        .container {
            max-width: 750px;
            margin: auto;
            background: #111827;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 20px 30px -5px rgba(0, 0, 0, 0.6);
            border: 1px solid #1f2937;
            width: 100%;
        }
        h2 { 
            text-align: center; 
            color: #ffffff; 
            font-size: 24px; 
            font-weight: 900;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        .form-section, .search-section, .settings-section {
            background: #1f2937;
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #374151;
        }
        .search-section { background: #0f172a; border-color: #1e293b; }
        .settings-section { background: #182235; border-color: #ff6b00; border-width: 1.5px; }
        .form-group { margin-bottom: 15px; }
        label { 
            display: block; 
            margin-bottom: 6px; 
            font-weight: 700; 
            font-size: 13px; 
            color: #d1d5db;
        }
        input, select, button {
            width: 100%;
            padding: 12px;
            border: 1px solid #374151;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            background-color: #030712;
            color: #fff;
            outline: none;
            transition: all 0.2s ease;
            font-weight: 600;
        }
        input:focus, select:focus {
            border-color: #ff6b00;
            box-shadow: 0 0 0 3px rgba(255, 107, 0, 0.15);
        }
        input:disabled, select:disabled {
            background-color: #0b0f19;
            color: #64748b;
            border-color: #1e293b;
            cursor: not-allowed;
        }
        button {
            background: linear-gradient(135deg, #ff6b00, #e65c00);
            color: white;
            border: none;
            font-weight: 700;
            cursor: pointer;
            margin-top: 5px;
            transition: all 0.2s ease;
            font-size: 16px;
            box-shadow: 0 4px 12px rgba(255, 107, 0, 0.3);
        }
        button:hover { 
            background: linear-gradient(135deg, #e65c00, #cc5200); 
            transform: translateY(-1px);
        }
        
        /* قائمة الأسماء عند البحث */
        .name-list {
            background: #030712;
            border: 1px solid #1f2937;
            border-radius: 8px;
            margin-top: 6px;
            max-height: 180px;
            overflow-y: auto;
        }
        .name-item {
            padding: 10px 14px;
            border-bottom: 1px solid #1f2937;
            cursor: pointer;
            font-size: 14px;
            color: #cbd5e1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .name-item:last-child { border-bottom: none; }
        .name-item:hover { background-color: #1e293b; color: #ff6b00; font-weight: bold; }

        .action-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }
        .edit-mode-btn { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; }
        .edit-mode-btn:hover { background: linear-gradient(135deg, #d97706, #b45309); }
        .delete-mode-btn { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .delete-mode-btn:hover { background: linear-gradient(135deg, #dc2626, #b91c1c); }
        .new-mode-btn { background: linear-gradient(135deg, #10b981, #059669); }
        .new-mode-btn:hover { background: linear-gradient(135deg, #059669, #047857); }
    </style>
</head>
<body>

<div class="container">
    <h2>On Fire Academy - لوحة التحكم</h2>

    <!-- إعدادات كود الكنترول السري -->
    <div class="settings-section">
        <label style="color: #ff6b00;">⚙️ إعدادات الأمان (تغيير كود صفحة الكنترول):</label>
        <div style="display: flex; gap: 10px; margin-top: 8px;">
            <input type="text" id="adminCodeInput" placeholder="أدخل كود الكنترول الجديد (مثل 0000)" maxlength="6">
            <button onclick="updateAdminCode()" style="width: 140px; margin-top:0;">تحديث الكود</button>
        </div>
    </div>

    <!-- 1. البحث السريع في الأعلى -->
    <div class="search-section">
        <label>🔍 بحث سريع (ابحث باسم الطالب أو الكود):</label>
        <input type="text" id="searchInput" placeholder="اكتب للبحث الفوري..." autocomplete="off" oninput="filterData()">
        <div id="nameListContainer" class="name-list" style="display: none;"></div>
    </div>

    <!-- 2. خانات بيانات الطالب -->
    <div class="form-section">
        <input type="hidden" id="originalCode" value="">
        <div class="form-group">
            <label>اسم الطالب:</label>
            <input type="text" id="studentNameInput" placeholder="أدخل اسم الطالب..." autocomplete="off">
        </div>
        <div class="form-group">
            <label>كود التفعيل:</label>
            <input type="text" id="codeInput" placeholder="أدخل كود الطالب (4 أرقام)..." autocomplete="off" maxlength="4">
        </div>
        <div class="form-group">
            <label>المرحلة الدراسية:</label>
            <select id="gradeSelect">
                <option value="first-prep">أولى إعدادي</option>
                <option value="second-prep">ثانية إعدادي</option>
                <option value="third-prep">ثالثة إعدادي</option>
                <option value="first-secondary">أولى ثانوي</option>
                <option value="second-secondary">ثانية ثانوي</option>
                <option value="third-secondary">ثالثة ثانوي</option>
            </select>
        </div>
        <div class="form-group">
            <label>حالة الكود:</label>
            <select id="statusSelect">
                <option value="true">يعمل</option>
                <option value="false">لا يعمل</option>
            </select>
        </div>

        <!-- الأزرار الافتراضية (وضع الإضافة) -->
        <div id="defaultAddBtnContainer">
            <button onclick="saveNewStudent()">إضافة طالب جديد</button>
        </div>

        <!-- الأزرار التي تظهر بعد اختيار طالب من البحث -->
        <div id="selectedStudentActions" class="action-buttons" style="display: none;">
            <button class="edit-mode-btn" onclick="enableEditing()">تعديل</button>
            <button class="delete-mode-btn" onclick="deleteSelectedStudent()">حذف</button>
            <button class="new-mode-btn" onclick="resetToAddNew()">إضافة جديد</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js";
    import { getDatabase, ref, set, get, remove } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js";

    // استخدام الرابط الخاص بك
    const firebaseConfig = {
        databaseURL: "https://alforqan-dfb09-default-rtdb.firebaseio.com//"
    };

    // تهيئة Firebase بطريقة الـ Compat المتاحة في المشروع
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let allStudentsCache = [];

    // تحميل البيانات وجلب كود الأدمن الحالي
    window.loadData = async function() {
        try {
            // جلب كود الكنترول المحفوظ في القاعدة
            const adminSnapshot = await db.ref('settings/adminCode').once('value');
            if (adminSnapshot.exists()) {
                document.getElementById("adminCodeInput").value = adminSnapshot.val();
            } else {
                document.getElementById("adminCodeInput").value = "0000"; // القيمة الافتراضية
            }

            // جلب الأكواد والطلاب من جدول grades
            const snapshot = await db.ref('grades').once('value');
            allStudentsCache = [];
            if (snapshot.exists()) {
                const data = snapshot.val();
                for (let gradeKey in data) {
                    if (data[gradeKey] && data[gradeKey].codes) {
                        let codesObj = data[gradeKey].codes;
                        for (let codeKey in codesObj) {
                            let info = codesObj[codeKey];
                            allStudentsCache.push({
                                gradeKey: gradeKey,
                                codeKey: codeKey,
                                studentName: info.studentName || info.name || "بدون اسم",
                                active: info.active !== false // افتراضياً يعمل لو لم تُحدد
                            });
                        }
                    }
                }
            }
        } catch (error) {
            console.error("خطأ في التحميل", error);
        }
    };

    // تحديث كود صفحة الكنترول السري في القاعدة
    window.updateAdminCode = async function() {
        const newAdminCode = document.getElementById("adminCodeInput").value.trim();
        if (!newAdminCode) {
            alert("يرجى إدخال كود صحيح للكنترول!");
            return;
        }
        try {
            await db.ref('settings/adminCode').set(newAdminCode);
            alert("تم تحديث كود الكنترول السري بنجاح!");
        } catch (e) {
            alert("حدث خطأ أثناء تحديث كود الكنترول.");
        }
    };

    // دالة البحث الفوري
    window.filterData = function() {
        let query = document.getElementById("searchInput").value.toLowerCase().trim();
        let listContainer = document.getElementById("nameListContainer");

        if (!query) {
            listContainer.style.display = "none";
            listContainer.innerHTML = "";
            return;
        }

        let matched = allStudentsCache.filter(item => 
            item.studentName.toLowerCase().includes(query) || item.codeKey.toLowerCase().includes(query)
        );

        if (matched.length === 0) {
            listContainer.style.display = "block";
            listContainer.innerHTML = '<div style="padding: 10px 14px; color: #ef4444; font-size: 14px;">لا توجد نتائج مطابقة</div>';
            return;
        }

        listContainer.style.display = "block";
        listContainer.innerHTML = "";
        
        matched.forEach(item => {
            let div = document.createElement("div");
            div.className = "name-item";
            div.innerHTML = `<span>👤 ${item.studentName} <span style="color:#94a3b8; font-size:12px;">(${item.codeKey})</span></span> <span style="color:${item.active ? '#10b981':'#ef4444'}">${item.active ? 'يعمل':'لا يعمل'}</span>`;
            div.onclick = function() {
                selectStudent(item);
            };
            listContainer.appendChild(div);
        });
    };

    // عند اختيار طالب من نتائج البحث
    window.selectStudent = function(item) {
        document.getElementById("studentNameInput").value = item.studentName;
        document.getElementById("codeInput").value = item.codeKey;
        document.getElementById("gradeSelect").value = item.gradeKey;
        document.getElementById("statusSelect").value = item.active ? "true" : "false";
        document.getElementById("originalCode").value = item.codeKey;

        setFieldsLock(true);

        document.getElementById("defaultAddBtnContainer").style.display = "none";
        document.getElementById("selectedStudentActions").style.display = "grid";
        document.getElementById("nameListContainer").style.display = "none";
        document.getElementById("searchInput").value = "";
    };

    function setFieldsLock(isLocked) {
        document.getElementById("studentNameInput").disabled = isLocked;
        document.getElementById("codeInput").disabled = isLocked;
        document.getElementById("gradeSelect").disabled = isLocked;
        document.getElementById("statusSelect").disabled = isLocked;
    }

    window.enableEditing = function() {
        setFieldsLock(false);
        let actionsDiv = document.getElementById("selectedStudentActions");
        actionsDiv.innerHTML = `
            <button class="new-mode-btn" onclick="saveEditedStudent()" style="grid-column: span 2;">حفظ التعديلات</button>
            <button class="delete-mode-btn" onclick="resetToAddNew()">إلغاء</button>
        `;
    };

    window.resetToAddNew = function() {
        document.getElementById("studentNameInput").value = "";
        document.getElementById("codeInput").value = "";
        document.getElementById("originalCode").value = "";
        document.getElementById("gradeSelect").value = "first-prep";
        document.getElementById("statusSelect").value = "true";

        setFieldsLock(false);

        document.getElementById("defaultAddBtnContainer").style.display = "block";
        document.getElementById("selectedStudentActions").style.display = "grid";
        document.getElementById("selectedStudentActions").innerHTML = `
            <button class="edit-mode-btn" onclick="enableEditing()">تعديل</button>
            <button class="delete-mode-btn" onclick="deleteSelectedStudent()">حذف</button>
            <button class="new-mode-btn" onclick="resetToAddNew()">إضافة جديد</button>
        `;
        document.getElementById("selectedStudentActions").style.display = "none";
    };

    // حفظ طالب جديد
    window.saveNewStudent = async function() {
        const name = document.getElementById("studentNameInput").value.trim();
        const code = document.getElementById("codeInput").value.trim();
        const grade = document.getElementById("gradeSelect").value;
        const active = document.getElementById("statusSelect").value === "true";

        if (!name || !code) {
            alert("الرجاء إدخال اسم الطالب وكود التفعيل!");
            return;
        }

        try {
            await db.ref(`grades/${grade}/codes/${code}`).set({
                studentName: name,
                active: active
            });
            alert("تم إضافة الطالب وتفعيل الكود بنجاح!");
            resetToAddNew();
            loadData();
        } catch (e) {
            alert("حدث خطأ أثناء الحفظ");
        }
    };

    // حفظ التعديلات
    window.saveEditedStudent = async function() {
        const oldCode = document.getElementById("originalCode").value;
        const name = document.getElementById("studentNameInput").value.trim();
        const newCode = document.getElementById("codeInput").value.trim();
        const grade = document.getElementById("gradeSelect").value;
        const active = document.getElementById("statusSelect").value === "true";

        if (!name || !newCode) {
            alert("الرجاء ملء البيانات المطلوبة!");
            return;
        }

        try {
            if (oldCode !== newCode) {
                const gradesList = ["first-prep", "second-prep", "third-prep", "first-secondary", "second-secondary", "third-secondary"];
                for (let gKey of gradesList) {
                    await db.ref(`grades/${gKey}/codes/${oldCode}`).remove();
                }
            }

            await db.ref(`grades/${grade}/codes/${newCode}`).set({
                studentName: name,
                active: active
            });

            alert("تم تعديل بيانات الطالب وحالة الكود بنجاح!");
            resetToAddNew();
            loadData();
        } catch (e) {
            alert("حدث خطأ أثناء التعديل");
        }
    };

    // حذف الطالب
    window.deleteSelectedStudent = async function() {
        const code = document.getElementById("codeInput").value.trim();
        if (confirm("هل أنت متأكد من حذف هذا الطالب وكود التفعيل الخاص به نهائياً؟")) {
            try {
                const gradesList = ["first-prep", "second-prep", "third-prep", "first-secondary", "second-secondary", "third-secondary"];
                for (let gKey of gradesList) {
                    await db.ref(`grades/${gKey}/codes/${code}`).remove();
                }
                alert("تم حذف الطالب بنجاح.");
                resetToAddNew();
                loadData();
            } catch (e) {
                alert("حدث خطأ أثناء الحذف");
            }
        }
    };

    loadData();
</script>

</body>
</html>
